[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "indianconstitution"
version = "1.5.1"

description = "Programmatic Python framework for accessing the Constitution of India — supporting legal NLP, structure analysis, and retrieval applications."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = [
  "constitution",
  "india",
  "legal",
  "legal-nlp",
  "nlp",
  "information-retrieval",
  "law",
  "data-science",
  "graph-analysis",
  "cli",
  "pydantic",
]
authors = [
  { name = "Vikhram S", email = "vikhrams@saveetha.ac.in" },
]
maintainers = [
  { name = "Vikhram S", email = "vikhrams@saveetha.ac.in" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0.0",
  "typer[all]>=0.9.0",
  "rich>=13.0.0",
  "diskcache>=5.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.0.0",
  "ruff>=0.4.0",
  "mypy>=1.0.0",
  "hypothesis>=6.0.0",
  "pre-commit>=3.0.0",
]
data = [
  "pandas>=2.0.0",
  "networkx>=3.0.0",
  "scipy>=1.10.0",
]
ai = [
  "sentence-transformers>=2.2.0",
  "torch>=2.0.0",
]
docs = [
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.0",
  "mkdocs-section-index>=0.3.0",
]
i18n = []
api = [
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
]
all = [
  "indianconstitution[data,ai,dev,docs,i18n,api]",
]

[project.urls]
Homepage       = "https://vikhram-s.github.io/IndianConstitution/"
Repository     = "https://github.com/Vikhram-S/IndianConstitution"
Documentation  = "https://vikhram-s.github.io/IndianConstitution/"
"Bug Tracker"  = "https://github.com/Vikhram-S/IndianConstitution/issues"
Changelog      = "https://github.com/Vikhram-S/IndianConstitution/blob/main/CHANGELOG.md"

[project.scripts]
indianconstitution = "indianconstitution.cli.main:app"

# ─── Build ──────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/indianconstitution"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "CHANGELOG.md",
  "CITATION.cff",
  "LICENSE",
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
]

# ─── Linting (Ruff) ─────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = [
  "*.pyi",
  ".git",
  "__pycache__",
  "dist",
  "build",
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "T20", # flake8-print
  "SIM", # flake8-simplify
  "ANN", # flake8-annotations
  "D",   # pydocstyle
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in default arguments
  "T201",   # print statements (allowed in CLI)
  "D107",   # missing docstring in __init__ (prefer class docstring)
  "D203",   # one-blank-line-before-class
  "D213",   # multi-line-summary-second-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["indianconstitution"]

# ─── Type Checking (Mypy) ────────────────────────────────────────────────────

[tool.mypy]
python_version          = "3.10"
strict                  = true
warn_return_any         = true
warn_unused_configs     = true
disallow_untyped_decorators = false
ignore_missing_imports  = true
follow_imports          = "skip"

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*", "diskcache.*", "networkx.*", "sentence_transformers.*", "fastapi.*", "uvicorn.*", "pandas.*"]
ignore_missing_imports = true

# ─── Testing (Pytest) ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = [
  "--cov=src/indianconstitution",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html:htmlcov",
  "--cov-fail-under=90",
  "--doctest-modules",
  "-v",
  "--tb=short",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ResourceWarning",
]

# ─── Coverage (Coverage.py) ──────────────────────────────────────────────────

[tool.coverage.run]
source      = ["src/indianconstitution"]
omit        = [
  "src/indianconstitution/core/legacy.py",
  "*/tests/*",
  "*/__pycache__/*",
]
branch      = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 90
exclude_lines  = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
